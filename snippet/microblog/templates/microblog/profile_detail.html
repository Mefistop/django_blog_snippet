{% extends 'base_generic.html'%}
{% block title %}
<title>Blogger</title>
{% endblock %}

{% block content %}
<h1>Blogger: {{ profile.user.username }}</h1>
<h3>Bio</h3>
<p>{{ profile.bio }}</p>
<h3>Blogs list</h3>
<div style="margin-left:20px;margin-top:20px">
  {% for blog in profile.blogs.all %}
  <li><a href="{{ blog.get_absolute_url }}"> {{blog.title}}</a> ({{blog.created_at|date:"M. d, Y"}})</li>
  {% endfor %}
</div>
{% endblock %}
