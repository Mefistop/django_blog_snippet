{% extends 'base_generic.html' %}
{% block title %}
<title>All blogs</title>
{% endblock %}

{% block content %}
<h1>All blogs</h1>
{% for blog in blog_list %}
<li>
    <a href="#">{{blog.title}}</a> ({{ blog.created_at|date:"M. d, Y" }}) - <a href="#">{{blog.author.user.username}}</a>
</li>
{% endfor %}

{% endblock %}
